<form  class="gap-2" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4">
    <legend class="fieldset-legend">Login</legend>

    <div class="flex flex-col gap-2 justify-start">
      <label class="label">Full Name</label>
      <input type="email" class="input" placeholder="Type your full name" formControlName="fullName" />
      @if( hasError('fullname') ) {
        <span class="text-center text-red-500 font-bold">{{getError('fullname')}}</span>
      }
    </div>

    <div class="flex flex-col gap-2 justify-start">
      <label class="label">Email</label>
      <input type="email" class="input" placeholder="Type your email" formControlName="email" />
      @if( hasError('email') ) {
        <span class="text-center text-red-500 font-bold">{{getError('email')}}</span>
      }
    </div>

    <div class="flex flex-col gap-2 justify-start">
      <label class="label">Password</label>
      <input type="password" class="input" placeholder="******" formControlName="password" autocomplete="false" />
      @if(hasError('password')) {
          <span class="text-center text-red-500 font-bold">
          {{getError('password')}}
        </span>
      }
    </div>

    <div class="flex flex-col gap-2 justify-start">
      <label class="label">Confirm password</label>
      <input type="password" class="input" placeholder="******" formControlName="confirm_password" autocomplete="false" />
      @if(hasError('confirm_password')) {
          <span class="text-center text-red-500 font-bold">
          {{getError('confirm_password')}}
        </span>
      }
    </div>

    <button class="btn btn-neutral mt-4" [disabled]="loginForm.invalid">Register</button>

    <p class="text-center text-primary cursor-pointer font-bold">
      <a [routerLink]="'/auth/register'">Create account</a>
    </p>
  </fieldset>
</form>
