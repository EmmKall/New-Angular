<div class="">

  <form  class="w-full gap-2" [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    @if(errors.length > 0) {
      <div class="errors flex flex-col gap-2 justify-center max-w-xs text-xs">
        @for(error of errors; track error){
          <span class="text-center text-white bg-red-300 font-bold mb-2 rounded-2xl py-1 px-2">{{error}}</span>
        }
      </div>
    }

    <fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4">
      <legend class="fieldset-legend">Login</legend>

      <div class="flex flex-col gap-2 justify-start">
        <label class="label">Email</label>
        <input type="email" class="input" placeholder="Type your email" formControlName="email" />
        @if( hasError('email') ) {
          <span class="text-center text-red-500 font-bold">{{getError('email')}}</span>
        }
      </div>

      <div class="flex flex-col gap-2 justify-start">
        <label class="label">Password</label>
        <input type="password" class="input" placeholder="******" formControlName="password" autocomplete="false" />
        @if(hasError('password')) {
          <span class="text-center text-red-500 font-bold">
            {{getError('password')}}
          </span>
        }
      </div>

      @if(isRequestDone && errors.length == 0) {
        <p class="text-center text-white bg-green-300 font-bold my-2 rounded-2xl py-1 px-2">Login succesfully</p>
      }

      <button class="btn btn-neutral mt-4" [disabled]="loginForm.invalid">Login</button>

      <p class="text-center text-primary cursor-pointer font-bold">
        <a [routerLink]="'/auth/register'">Create account</a>
      </p>

    </fieldset>
  </form>

</div>
